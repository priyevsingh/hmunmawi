name: Idea or question
description: A feature idea, a new connection you'd like, or a "how do I…" question.
labels: ["question"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to do or know?
      description: Plain words are perfect. If it's an idea, say what problem it would solve for you.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried or looked at? (optional)
      description: For example a section of the README, or what the app showed.
