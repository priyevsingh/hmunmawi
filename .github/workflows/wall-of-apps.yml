name: Wall of Apps

# A pull request that touches the wall is checked against Apple's public App Store lookup (real, live, no
# duplicates). After a merge to main, the icons, mosaic image, full list and README block are rebuilt and committed.
on:
  pull_request:
    paths: ["docs/wall-of-apps.json"]
  push:
    branches: [main]
    paths: ["docs/wall-of-apps.json"]
  workflow_dispatch:

permissions: {}   # each job asks only for what it needs

concurrency:
  group: wall-of-apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Check the entries
        run: python3 scripts/wall-of-apps.py --check

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Check and rebuild
        run: python3 scripts/wall-of-apps.py --check --build
      - name: Commit the rebuilt wall
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/WALL-OF-APPS.md docs/wall
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Wall of Apps: rebuild the mosaic and list"
          git push
