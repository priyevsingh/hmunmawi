name: CI

# Every pull request and every push to main: build and test the app on a GitHub-hosted macOS 26 Mac, and test the
# live-sales Cloudflare worker on Linux. Read-only, no secrets: signing and releases happen on the maintainer's Mac.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (swift build and test)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  worker:
    name: Live-sales worker (Node tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Tests/Worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Webhook test
        run: node asc_webhook_test.mjs
      - name: Worker tests
        run: npm test
