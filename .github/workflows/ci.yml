name: CI

# Every pull request and every push to main: build and test the app on a GitHub-hosted macOS 26 Intel Mac (Xcode 26
# and the macOS 26 SDK), and test the live-sales Cloudflare worker on Linux. Read-only, no secrets: signing and
# releases happen on the maintainer's Mac.
#
# The app requires the macOS 26 SDK (Package.swift platforms macOS 26.0), so macos-15 cannot build it.
# macos-latest is the same Apple Silicon pool as macos-26; that pool is capacity-constrained, and a job left queued
# there is cancelled by GitHub ("not acquired by Runner") and reported as a failure. macos-26-intel is a separate
# x64 pool with the same SDK. timeout-minutes must be long enough that a queue wait is not cut off around 30 minutes.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request (or per branch/tag on other events). A new push to a PR cancels the previous run so a
# stale macOS job is not left queued and later reported as a failure. Runs on main and on tags are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: App (swift build and test)
    if: github.event.action != 'closed'
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  worker:
    name: Live-sales worker (Node tests)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Tests/Worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Webhook test
        run: node asc_webhook_test.mjs
      - name: Worker tests
        run: npm test
