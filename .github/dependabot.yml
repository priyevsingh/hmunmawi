# Weekly, grouped dependency updates (one pull request per ecosystem), checked by CI like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: swift
    directory: /
    schedule: { interval: weekly }
    groups:
      swift: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /Tests/Worker
    schedule: { interval: weekly }
    groups:
      worker-tests: { patterns: ["*"] }
